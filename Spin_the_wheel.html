<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Spin the Wheel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to bottom right, #e0f2fe, #fce7f3);
        }

        #wheelCanvas {
            display: block;
            max-width: 100%;
            height: auto;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ef4444;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #spinButton {
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        #spinButton:active {
            transform: scale(0.95);
        }

        #spinButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resultBox {
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-3xl md:text-4xl font-bold text-gray-700 mb-8 text-center">Baby Shower Spin the Wheel!</h1>

    <div class="relative w-full max-w-md aspect-square mb-8 flex items-center justify-center">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <button id="spinButton" class="bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 px-8 rounded-full text-xl shadow-lg focus:outline-none focus:ring-2 focus:ring-pink-300 focus:ring-opacity-75 mb-6">
        Spin the Wheel!
    </button>

    <div id="resultBox" class="mt-4 p-4 bg-white rounded-lg shadow-md text-center text-lg font-semibold text-gray-700 opacity-0 transform scale-95">
        Spin to see your prize!
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinButton = document.getElementById('spinButton');
        const resultBox = document.getElementById('resultBox');

        const segments = [
            { color: '#a7f3d0', label: 'Sorry!' },        
            { color: '#bfdbfe', label: 'It\'s a Boy! 💙' }, 
            { color: '#fecdd3', label: 'Sorry!' },        
            { color: '#fef08a', label: 'It\'s a Girl! 🎀' }, 
            { color: '#d1fae5', label: 'Sorry!' },        
            { color: '#e9d5ff', label: 'Healthy Baby! 🎉' },
            { color: '#fde68a', label: 'Sorry!' }        
        ];
        const numSegments = segments.length;
        const anglePerSegment = (2 * Math.PI) / numSegments;
        const wheelRadius = canvas.width / 2;
        const labelRadius = wheelRadius * 0.75; 
        let currentAngle = 0; 
        let isSpinning = false;

        function drawSegment(index, startAngle) {
            const endAngle = startAngle + anglePerSegment;
            const segment = segments[index];

            ctx.beginPath();
            ctx.moveTo(wheelRadius, wheelRadius);
            ctx.arc(wheelRadius, wheelRadius, wheelRadius - 5, startAngle, endAngle);
            ctx.closePath();

            ctx.fillStyle = segment.color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function drawSegmentLabel(index, startAngle) {
            const segment = segments[index];
            const textAngle = startAngle + anglePerSegment / 2;

            ctx.save();
            ctx.translate(wheelRadius, wheelRadius);
            ctx.rotate(textAngle);

            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#374151';
            ctx.font = 'bold 16px Inter';

            ctx.fillText(segment.label, labelRadius, 0);

            ctx.restore();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let startAngle = 0;
            for (let i = 0; i < numSegments; i++) {
                drawSegment(i, startAngle);
                drawSegmentLabel(i, startAngle);
                startAngle += anglePerSegment;
            }

             ctx.beginPath();
             ctx.arc(wheelRadius, wheelRadius, 20, 0, 2 * Math.PI);
             ctx.fillStyle = '#f8fafc';
             ctx.fill();
             ctx.strokeStyle = '#e2e8f0';
             ctx.lineWidth = 2;
             ctx.stroke();
        }

        function spinWheel() {
            if (isSpinning) return;

            isSpinning = true;
            spinButton.disabled = true;
            resultBox.style.opacity = '0';
            resultBox.style.transform = 'scale(0.95)';

            const randomSpin = Math.random() * 360 + 360 * 5;
            const targetAngle = currentAngle + randomSpin;

            canvas.style.transform = `rotate(${targetAngle}deg)`;

            currentAngle = targetAngle % 360;

            canvas.addEventListener('transitionend', handleSpinEnd, { once: true });
        }

        function handleSpinEnd() {
            canvas.style.transition = 'none';
            canvas.style.transform = `rotate(${currentAngle}deg)`;
            canvas.offsetHeight;
            canvas.style.transition = 'transform 5s cubic-bezier(0.25, 0.1, 0.25, 1)';

            const finalAngleRad = ((360 - currentAngle) % 360) * (Math.PI / 180);
            const pointerAngleRad = (finalAngleRad + Math.PI / 2) % (2 * Math.PI);

            const winningIndex = Math.floor(pointerAngleRad / anglePerSegment);
            const winningSegment = segments[winningIndex];

            resultBox.textContent = winningSegment.label;
            resultBox.style.opacity = '1';
            resultBox.style.transform = 'scale(1)';

            isSpinning = false;
            spinButton.disabled = false;
        }

        spinButton.addEventListener('click', spinWheel);
        drawWheel();
    </script>

</body>
</html>
